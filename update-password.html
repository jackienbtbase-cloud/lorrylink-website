<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | NBT LorryLink</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans flex flex-col h-screen overflow-hidden">

    <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="ri-truck-line"></i> NBT LorryLink
        </h1>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm text-left">
            <h2 class="text-xl font-bold mb-2 text-center">Create New Password</h2>
            <p class="text-xs text-gray-500 mb-4 text-center">Please enter your new password below.</p>
            
            <form id="update-password-form" class="flex flex-col gap-3">
                <div>
                    <label class="text-xs font-bold text-gray-600">New Password</label>
                    <input type="password" id="new-password" class="w-full border border-gray-300 rounded p-2 mt-1 text-sm" required minlength="6">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold shadow hover:bg-green-700 mt-2">
                    Save New Password
                </button>
            </form>
        </div>
    </main>

    <script>
        // 1. SUPABASE CONFIGURATION (Must match your app.js)
        const SUPABASE_URL = 'https://cqbuguapyeyshujhkvky.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxYnVndWFweWV5c2h1amhrdmt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTI5NTQsImV4cCI6MjEwMDI2ODk1NH0.C2EuPMe1ijXCcgJ300iGs-yjyVOs4lC-TuwGu33WAsc'; // <-- PASTE YOUR LONG KEY HERE

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. FORM SUBMISSION LOGIC
        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const submitBtn = e.target.querySelector('button');

            // Disable button to prevent double-clicks
            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';

            // Because the user clicked the magic email link, Supabase already knows who they are.
            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert("Error updating password: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Save New Password';
            } else {
                alert("Password updated successfully! Redirecting to login...");
                
                // Sign them out of this temporary session so they can log in normally
                await supabaseClient.auth.signOut();
                
                // Redirect back to your main app
                window.location.href = 'index.html'; 
            }
        });
    </script>
</body>
</html>
